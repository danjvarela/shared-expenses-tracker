<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Offline — Shared Expenses</title>
		<style>
			:root {
				--bg: #ffffff;
				--fg: #1c1917;
				--muted: #78716c;
				--primary: #008236;
				--primary-fg: #f0fdf4;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0c0a09;
					--fg: #fafaf9;
					--muted: #a8a29e;
					--primary: #016630;
					--primary-fg: #f0fdf4;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
			}
			body {
				background: var(--bg);
				color: var(--fg);
				font-family:
					'Inter Variable', Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				padding-top: max(1.5rem, env(safe-area-inset-top));
				padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
			}
			.card {
				max-width: 26rem;
				text-align: center;
			}
			.icon {
				width: 3rem;
				height: 3rem;
				margin: 0 auto 1.25rem;
				color: var(--primary);
			}
			h1 {
				font-size: 1.25rem;
				font-weight: 600;
				margin: 0 0 0.5rem;
			}
			p {
				color: var(--muted);
				margin: 0 0 1.5rem;
				line-height: 1.5;
			}
			a {
				display: inline-block;
				background: var(--primary);
				color: var(--primary-fg);
				text-decoration: none;
				font-weight: 500;
				padding: 0.625rem 1.25rem;
				border-radius: 0.5rem;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<line x1="1" y1="1" x2="23" y2="23"></line>
				<path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
				<path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
				<path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
				<path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
				<path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
				<line x1="12" y1="20" x2="12.01" y2="20"></line>
			</svg>
			<h1>You're offline</h1>
			<p>Reconnect to the internet to use Shared Expenses. Your app will load automatically once you're back online.</p>
			<a href="/">Try again</a>
		</div>
		<script>
			window.addEventListener('online', () => window.location.reload());
		</script>
	</body>
</html>
